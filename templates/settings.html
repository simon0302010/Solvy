<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Settings</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <style>

  </style>
</head>
<body>
  <div class="container py-4">
    <h2 class="text-center mb-4">Settings</h2>

    <!-- Display & Appearance -->
    <div class="settings-section">
      <h5>Display & Appearance</h5>
      <div class="form-check form-switch">
        <input class="form-check-input" type="checkbox" id="darkModeToggle">
        <label class="form-check-label" for="darkModeToggle">Dark Mode</label>
      </div>

      <label for="fontSizeSelect" class="form-label mt-2">Font Size</label>
      <select class="form-select" id="fontSizeSelect">
        <option value="small">Small</option>
        <option value="medium" selected>Medium</option>
        <option value="large">Large</option>
      </select>
    </div>

    <!-- Language & Region -->
    <div class="settings-section">
      <h5>Language & Region (WIP)</h5>
      <label for="languageSelect" class="form-label">Language</label>
      <select class="form-select" id="languageSelect">
        <option value="en" selected>English</option>
        <option value="fr">French</option>
        <option value="es">Spanish</option>
        <option value="hi">Hindi</option>
        <!-- Add more as needed -->
      </select>

      <label for="regionInput" class="form-label mt-2">Region</label>
      <input type="text" class="form-control" id="regionInput" placeholder="Enter country or region">
    </div>

    <!-- Help & About -->
    <div class="settings-section">
      <h5>Help & Support</h5>
      <a href="javascript:void(0)" class="btn btn-outline-primary btn-sm" onclick="alert('(WIP)')">FAQ</a>
      <a href="mailto:simon@hackclub.app" class="btn btn-outline-secondary btn-sm">Contact Support</a>
    </div>

    <div class="settings-section">
      <h5>About This App</h5>
      <b>Solvy</b>
      <pt>Version: 1.0.0</pt>
      <p>Built by: gamerwaves & simon0302010</p>
      <a href="javascript:void(0)" onclick="alert('TOS')" class="d-block">Terms of Service</a>
      <a href="javascript:void(0)" onclick="alert('Your Privacy Does Not Matter.')" class="d-block">Privacy Policy</a>
    </div>

    <div class="text-center mt-4">
      <button class="btn btn-danger" onclick="clearLocalSettings()">Reset to Default</button>
    </div>
  </div>

  <!-- Bottom Nav -->
  <div class="bottom-nav">
    <a href="/" class="text-decoration-none nav-icon">
        <i class="bi bi-house-door-fill"></i>
        Home
    </a>
    <a href="/scan" class="text-decoration-none nav-icon" id="scan-bar">
        <i id="scan-icon" class="bi bi-camera-fill"></i>
        <span id="scan-label">Scan</span>
    </a>
    <a href="/chat" class="text-decoration-none nav-icon">
        <i class="bi bi-chat-dots-fill"></i>
        Chat
    </a>
    <a href="/settings" class="text-decoration-none nav-icon active">
        <i class="bi bi-gear-fill"></i>
        Settings
    </a>
</div>


  <script>
        // Swap Scan icon & label for Upload if on desktop
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    if (!isMobile) {
        const scanBar = document.getElementById('scan-bar');
        const scanIcon = document.getElementById('scan-icon');
        const scanLabel = document.getElementById('scan-label');

        if (scanIcon) scanIcon.className = 'bi bi-upload';
        if (scanLabel) scanLabel.textContent = 'Upload';
    }

    const fontSizeMap = {
      small: "14px",
      medium: "16px",
      large: "18px"
    };

    // Load saved settings
    window.addEventListener("DOMContentLoaded", () => {
      if (localStorage.getItem("darkMode") === "true") {
        document.body.classList.add("dark-mode");
        document.getElementById("darkModeToggle").checked = true;
      }

      const fontSize = localStorage.getItem("fontSize") || "medium";
      document.getElementById("fontSizeSelect").value = fontSize;
      document.body.style.fontSize = fontSizeMap[fontSize];

      document.getElementById("languageSelect").value = localStorage.getItem("language") || "en";
      document.getElementById("regionInput").value = localStorage.getItem("region") || ""
    });

    // Save on change
    document.getElementById("darkModeToggle").addEventListener("change", e => {
      document.body.classList.toggle("dark-mode", e.target.checked);
      localStorage.setItem("darkMode", e.target.checked);
    });

    document.getElementById("fontSizeSelect").addEventListener("change", e => {
      const size = e.target.value;
      document.body.style.fontSize = fontSizeMap[size];
      localStorage.setItem("fontSize", size);
    });

    document.getElementById("contrastToggle").addEventListener("change", e => {
      document.body.classList.toggle("high-contrast", e.target.checked);
      localStorage.setItem("highContrast", e.target.checked);
    });

    document.getElementById("languageSelect").addEventListener("change", e => {
      localStorage.setItem("language", e.target.value);
    });

    document.getElementById("regionInput").addEventListener("input", e => {
      localStorage.setItem("region", e.target.value);
    });

    document.getElementById("notifToggle").addEventListener("change", e => {
      localStorage.setItem("notifications", e.target.checked);
    });

    function clearLocalSettings() {
      if (confirm("Reset all settings to default?")) {
        localStorage.removeItem("darkMode");
        localStorage.removeItem("fontSize");
        localStorage.removeItem("highContrast");
        localStorage.removeItem("language");
        localStorage.removeItem("region");
        localStorage.removeItem("notifications");
        location.reload();
      }
    }
  </script>
</body>
</html>
