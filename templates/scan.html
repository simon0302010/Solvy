<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scan</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="manifest" href="/static/json/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" sizes="1024x1024" href="/static/images/1024.png">
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
</head>
<body>
  <div class="container text-center camera-area d-flex justify-content-center">
    <p class="text-small">Tap the scan button to capture a question.</p>
  </div>

  <div class="d-flex justify-content-center align-items-center gap-2 mb-3">
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;">
    <button id="scan-btn" class="scan-button">
      <i class="bi bi-camera"></i>
    </button>
    <input type="file" id="uploadInput" accept="image/*" style="display: none;">
    <button id="upload-btn" class="upload-button">
      <i class="bi bi-upload"></i>
    </button>
  </div>

  <div class="bottom-nav">
    <a href="/" class="text-decoration-none nav-icon">
      <i class="bi bi-house-door-fill"></i> Home
    </a>
    <a href="/scan" class="text-decoration-none nav-icon active" id="scan-bar">
      <i id="scan-icon" class="bi bi-camera-fill"></i> <span id="scan-label">Scan</span>
    </a>
    <a href="/chat" class="text-decoration-none nav-icon">
      <i class="bi bi-chat-dots-fill"></i> Chat
    </a>
    <a href="/settings" class="text-decoration-none nav-icon">
      <i class="bi bi-gear-fill"></i> Settings
    </a>
  </div>

  <script>
    // Load saved settings
    window.addEventListener("DOMContentLoaded", () => {
      if (localStorage.getItem("darkMode") === "true") {
        document.body.classList.add("dark-mode");
        document.getElementById("darkModeToggle").checked = true;
      }

      const fontSize = localStorage.getItem("fontSize") || "medium";
      document.getElementById("fontSizeSelect").value = fontSize;
      document.body.style.fontSize = fontSizeMap[fontSize];

      document.getElementById("languageSelect").value = localStorage.getItem("language") || "en";
      document.getElementById("regionInput").value = localStorage.getItem("region") || ""
    });
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
if (!isMobile) {
    const scanIcon = document.getElementById('scan-icon');
    const scanLabel = document.getElementById('scan-label');
    const scanDir = document.getElementById('scan-dir');
    if (scanIcon) scanIcon.className = 'bi bi-upload';
    if (scanLabel) scanLabel.textContent = 'Upload';
    if (scanDir) scanDir.textContent = 'Tap the upload button to capture a question.';
}
    function saveToHistory(scanData) {
      if (!scanData.image_data) return;
      scanData.timestamp = new Date().toISOString();
      localStorage.setItem('newScanData', JSON.stringify(scanData));
      const history = JSON.parse(localStorage.getItem('scanHistory') || '[]');
      history.unshift({
        id: scanData.id,
        image_data: scanData.image_data,
        filename: scanData.filename,
        source: scanData.source,
        timestamp: scanData.timestamp
      });
      if (history.length > 50) history.splice(50);
      localStorage.setItem('scanHistory', JSON.stringify(history));
    }

    function goToChat(chatId) {
      window.location.href = "/chat/" + chatId;
    }

    
function processImageUpload(file, isCamera = false) {
    const formData = new FormData();
    formData.append('image', file);

    const container = document.querySelector(".camera-area");
    container.innerHTML = '<p class="text-small">Processing, do not close this tab</p><div class="spinner-border text-danger" role="status"><span class="visually-hidden">Loading...</span></div>';

    fetch('/upload', {
        method: 'POST',
        body: formData
    })
    .then(res => res.json().then(data => ({status: res.status, ok: res.ok, data: data})))
    .then(response => {
        if (!response.ok) {
            // Handle error response from server
            const errorMessage = response.data.error || 'Upload failed';
            throw new Error(errorMessage);
        }
        const data = response.data;
        if (data.image_data) {
            // Generate a unique chat ID for this image
            const chatId = data.id; // Use the server-generated ID
            
            // Store current scan for display purposes
            localStorage.setItem('lastScan', data.image_data);
            
            // Store with chat-specific key
            localStorage.setItem(`imageBase64_${chatId}`, data.image_data);
            
            // Also store globally for backward compatibility
            localStorage.setItem('imageBase64', data.image_data);
            
            // Add to history with additional metadata
            const historyItem = {
                id: data.id,
                image_data: data.image_data,
                filename: data.filename || file.name,
                source: isCamera ? 'camera' : 'upload',
                timestamp: new Date().toISOString(),
                status: 'success',
                chat_id: chatId // Store the associated chat ID
            };
            
            saveToHistory(historyItem);
            
            container.innerHTML = `
                <div class="text-center">
                    <p class="text-small">✅ Processed Successfully</p>
                    <img src="${data.image_data}" alt="Processed Image" class="img-fluid rounded" style="max-height: 400px;">
                    <div class="mt-3 d-flex gap-2 justify-content-center flex-wrap">
                        <a href="${data.image_data}" download="solved_worksheet.png" class="btn btn-success">
                            <i class="bi bi-download"></i> Download
                        </a>
                        <a href="/" class="btn btn-primary">
                            <i class="bi bi-house-door"></i> View History
                        </a>
                        <button class="btn btn-outline-secondary" onclick="location.reload()">
                            <i class="bi bi-arrow-clockwise"></i> Scan Again
                        </button>
                        <a href="/chat/${chatId}" class="btn btn-info">
                            <i class="bi bi-chat-dots"></i> Start Chat
                        </a>
                    </div>
                </div>
            `;
        }
    })
    .catch(err => {
        console.error('Upload failed:', err);
        const errorMsg = err.message || 'Upload failed';
        container.innerHTML = `<p class="text-danger">❌ ${errorMsg}</p>`;
    });
    }

    document.getElementById('scan-btn').onclick = () => document.getElementById('cameraInput').click();
    document.getElementById('upload-btn').onclick = () => document.getElementById('uploadInput').click();

    document.getElementById('cameraInput').onchange = e => {
      const file = e.target.files[0];
      if (file) processImageUpload(file, true);
    };
    document.getElementById('uploadInput').onchange = e => {
      const file = e.target.files[0];
      if (file) processImageUpload(file, false);
    };

    window.addEventListener('DOMContentLoaded', () => {
      const container = document.querySelector(".camera-area");
      const lastScan = localStorage.getItem('lastScan');
      if (lastScan) {
        container.innerHTML = `
          <div class="text-center">
            <p class="text-small">Last Scanned Image:</p>
            <img src="${lastScan}" class="img-fluid rounded" style="max-height: 400px;">
            <div class="mt-3 d-flex gap-2 justify-content-center flex-wrap">
              <a href="${lastScan}" download="last_scan.png" class="btn btn-success">
                <i class="bi bi-download"></i> Download
              </a>
              <a href="/" class="btn btn-primary">
                <i class="bi bi-house-door"></i> View All Scans
              </a>
            </div>
          </div>`;
      }
    });
  </script>
</body>
</html>
