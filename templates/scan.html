<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scan</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="manifest" href="/static/json/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>

    <div class="container text-center camera-area">
        <video id="camera" autoplay playsinline></video>
        <p class="text-small">Tap the scan button to capture a question</p>
    </div>

    <!-- Floating Scan Button -->
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;">
    <button class="scan-button" onclick="document.getElementById('cameraInput').click()">
        <i class="bi bi-camera"></i>
    </button>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <a href="/" class="text-decoration-none nav-icon">
            <i class="bi bi-house-door-fill"></i>
            Home
        </a>
        <a href="/scan" class="text-decoration-none nav-icon active">
            <i class="bi bi-camera-fill"></i>
            Scan
        </a>
        <a href="#" class="text-decoration-none nav-icon">
            <i class="bi bi-chat-dots-fill"></i>
            Chat
        </a>
        <a href="#" class="text-decoration-none nav-icon">
            <i class="bi bi-gear-fill"></i>
            Settings
        </a>
    </div>

</body>
</html>
