<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scan</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <div class="container text-center camera-area">
        <video id="camera" autoplay playsinline></video>
        <p class="text-small">Tap the scan button to capture a question</p>
    </div>

    <!-- Floating Scan Button -->
    <button class="scan-button" onclick="captureImage()">
        <i class="bi bi-camera"></i>
    </button>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <a href="/" class="text-decoration-none nav-icon">
            <i class="bi bi-house-door-fill"></i>
            Home
        </a>
        <a href="/scan" class="text-decoration-none nav-icon active">
            <i class="bi bi-camera-fill"></i>
            Scan
        </a>
        <a href="#" class="text-decoration-none nav-icon">
            <i class="bi bi-chat-dots-fill"></i>
            Chat
        </a>
        <a href="#" class="text-decoration-none nav-icon">
            <i class="bi bi-gear-fill"></i>
            Settings
        </a>
    </div>

    <!-- Hidden canvas for capture -->
    <canvas id="canvas" style="display:none;"></canvas>
    <input type="image" src="" id="camera-image" style="display: none;">

    <script>
        const video = document.getElementById('camera');
        const canvas = document.getElementById('canvas');

        // Start camera
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => {
                video.srcObject = stream;
            })
            .catch(err => {
                console.error("Camera access denied:", err);
                alert("Please allow camera access to scan questions.");
            });

        // Capture image from video
        function captureImage() {
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 120, 120, canvas.width, canvas.height);

            const imageData = canvas.toDataURL('image/png');
            console.log("Captured image data URL:");
            console.log(imageData);
            document.getElementById("camera-image").src=imageData
            document.getElementById("camera-image").style.display="block";
            console.log("\n\n\nCamera-Image:"+document.getElementById("camera-image").getAttribute('src'));

            fetch('/upload', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ image: imageData }) // imageData is your base64 string
            })
            .then(response => response.json())
            .then(data => {
                console.log("Server response:", data);
            })
            .catch(error => {
                console.error("Error uploading image:", error);
            });
            
        }
    </script>

</body>
</html>
