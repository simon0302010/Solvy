<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scan</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="manifest" href="/static/json/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" sizes="1024x1024" href="/static/images/1024.png">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
</head>
<body>

    <div class="container text-center camera-area d-flex justify-content-center">
        <p class="text-small">Tap the scan button to capture a question.</p>
        {% if uploaded_image %}
    <div class="text-center mt-4">
        <p>Scanned Image:</p>
        <img src="{{ uploaded_image }}" alt="Scanned" class="img-fluid rounded" style="max-height: 300px;">
    </div>
{% endif %}

    </div>

    <div class="d-flex justify-content-center align-items-center gap-2 mb-3">
        <!-- Floating Scan Button -->
        <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;">
        <button id="scan-btn" class="scan-button">
            <i class="bi bi-camera"></i>
        </button>

        <!-- Floating Upload Button -->
        <input type="file" id="uploadInput" accept="image/*" style="display: none;">
        <button id="upload-btn" class="upload-button">
            <i class="bi bi-upload"></i>
        </button>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <a href="/" class="text-decoration-none nav-icon">
            <i class="bi bi-house-door-fill"></i>
            Home
        </a>
        <a href="/scan" class="text-decoration-none nav-icon active" id="scan-bar">
            <i id="scan-icon" class="bi bi-camera-fill"></i>
            <span id="scan-label">Scan</span>
        </a>        
        <a href="/chat" class="text-decoration-none nav-icon">
            <i class="bi bi-chat-dots-fill"></i>
            Chat
        </a>
        <a href="javascript:void(0);" class="text-decoration-none nav-icon"
        onclick="alert('Settings feature coming soon!');">
            <i class="bi bi-gear-fill"></i>
            Settings
        </a>
    </div>
<script>
    // Desktop override for Scan button in bottom nav
const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
if (!isMobile) {
    const scanIcon = document.getElementById('scan-icon');
    const scanLabel = document.getElementById('scan-label');
    const scanDir = document.getElementById('scan-dir');
    if (scanIcon) scanIcon.className = 'bi bi-upload';
    if (scanLabel) scanLabel.textContent = 'Upload';
    if (scanDir) scanDir.textContent = 'Tap the upload button to capture a question.';
}
    function saveToHistory(scanData) {
        // Ensure we have the image data
        if (!scanData.image_data) {
            console.error('No image data to save to history');
            return;
        }
        
        // Add timestamp
        scanData.timestamp = new Date().toISOString();
        
        // Store temporarily to be picked up by home page
        localStorage.setItem('newScanData', JSON.stringify(scanData));
        
        // Also save to scan history directly
        const history = JSON.parse(localStorage.getItem('scanHistory') || '[]');
        
        // Make sure we're saving the complete scan data including image
        const historyItem = {
            id: scanData.id,
            image_data: scanData.image_data, // This is the base64 encoded image
            filename: scanData.filename,
            source: scanData.source,
            timestamp: scanData.timestamp,
            original_filename: scanData.original_filename || scanData.filename
        };
        
        history.unshift(historyItem);
        
        // Keep only last 50 items
        if (history.length > 50) {
            history.splice(50);
        }
        
        localStorage.setItem('scanHistory', JSON.stringify(history));
        console.log('Saved to history:', historyItem)
    }
    function goToChat() {
                        // Just a safeguard: store again if somehow it's not in session
                        const img = localStorage.getItem('imageBase64');
                        if (img) sessionStorage.setItem('uploadedImage', img);
                        // Use UUID or redirect to new chat
                        window.location.href = "/chat/" + crypto.randomUUID();
                        }

    function processImageUpload(file, isCamera = false) {
    const formData = new FormData();
    formData.append('image', file);

    const container = document.querySelector(".camera-area");
    container.innerHTML = '<p class="text-small">Processing, do not close this tab</p><div class="spinner-border text-danger" role="status"><span class="visually-hidden">Loading...</span></div>';

    fetch('/upload', {
        method: 'POST',
        body: formData
    })
    .then(res => {
        if (!res.ok) {
            throw new Error(`HTTP ${res.status}: ${res.statusText}`);
        }
        return res.json();
    })
    .then(data => {
        if (data.image_data) {
            // Store current scan for display purposes
            localStorage.setItem('lastScan', data.image_data);
            
            // IMPORTANT: Store for chat functionality with the correct key
            localStorage.setItem('imageBase64', data.image_data);
            
            // Add to history with additional metadata
            const historyItem = {
                id: data.id,
                image_data: data.image_data,
                filename: data.filename || file.name,
                source: isCamera ? 'camera' : 'upload',
                timestamp: new Date().toISOString(),
                status: 'success'
            };
            
            saveToHistory(historyItem);
            
            container.innerHTML = `
                <div class="text-center">
                    <p class="text-small">✅ Processed Successfully</p>
                    <img src="${data.image_data}" alt="Processed Image" class="img-fluid rounded" style="max-height: 400px;">
                    <div class="mt-3 d-flex gap-2 justify-content-center flex-wrap">
                        <a href="${data.image_data}" download="solved_worksheet.png" class="btn btn-success">
                            <i class="bi bi-download"></i> Download
                        </a>
                        <a href="/" class="btn btn-primary">
                            <i class="bi bi-house-door"></i> View History
                        </a>
                        <button class="btn btn-outline-secondary" onclick="location.reload()">
                            <i class="bi bi-arrow-clockwise"></i> Scan Again
                        </button>
                        <button class="btn btn-info" onclick="goToChat()">
                        <i class="bi bi-chat-dots"></i> Start Chat
                        </button>
                    </div>
                </div>
            `;
        } else {
            // Even if processing failed, let's try to save the original image to history
            const reader = new FileReader();
            reader.onload = function(e) {
                const originalImageData = e.target.result;
                
                // Store original image for chat if processing failed
                localStorage.setItem('imageBase64', originalImageData);
                
                const historyItem = {
                    id: data.id || 'failed-' + Date.now(),
                    image_data: originalImageData,
                    filename: file.name,
                    source: isCamera ? 'camera' : 'upload',
                    timestamp: new Date().toISOString(),
                    status: 'failed',
                    error: data.error || 'Processing failed'
                };
                saveToHistory(historyItem);
            };
            reader.readAsDataURL(file);
            
            container.innerHTML = `
                <div class="text-center">
                    <p class="text-danger">❌ Error: ${data.error || 'Unknown error'}</p>
                    <p class="text-muted small">Original image saved - you can still chat about it</p>
                    <div class="mt-3 d-flex gap-2 justify-content-center flex-wrap">
                        <button class="btn btn-primary" onclick="location.reload()">
                            <i class="bi bi-arrow-clockwise"></i> Try Again
                        </button>
                        <a href="/chat" class="btn btn-info">
                            <i class="bi bi-chat-dots"></i> Chat About Image
                        </a>
                    </div>
                </div>
            `;
        }
    })
    .catch(err => {
        console.error('Upload error:', err);
        
        // Even on network/server error, try to save the original image
        const reader = new FileReader();
        reader.onload = function(e) {
            const originalImageData = e.target.result;
            
            // Store original image for chat
            localStorage.setItem('imageBase64', originalImageData);
            
            const historyItem = {
                id: 'error-' + Date.now(),
                image_data: originalImageData,
                filename: file.name,
                source: isCamera ? 'camera' : 'upload',
                timestamp: new Date().toISOString(),
                status: 'error',
                error: err.message || 'Network/Server error'
            };
            saveToHistory(historyItem);
        };
        reader.readAsDataURL(file);
        
        container.innerHTML = `
            <div class="text-center">
                <p class="text-danger">❌ An error occurred, please try again</p>
                <p class="text-muted small">Original image saved - you can still chat about it</p>
                <div class="mt-3 d-flex gap-2 justify-content-center flex-wrap">
                    <button class="btn btn-primary" onclick="location.reload()">
                        <i class="bi bi-arrow-clockwise"></i> Try Again
                    </button>
                    <a href="/chat" class="btn btn-info">
                        <i class="bi bi-chat-dots"></i> Chat About Image
                    </a>
                </div>
            </div>
        `;
    });
}

    document.getElementById('scan-btn').onclick = function(e) {
        e.preventDefault();
        if (confirm(
            "Important Notice:\n\n" +
            "Only non-personal data may be uploaded to this website.\n" +
            "It is strictly prohibited to upload any content that contains personal information such as names, addresses, photos, school names, or any other identifiable data.\n" +
            "Uploaded files are processed automatically by external AI services by Google, Roboflow and Hackclub and saved afterwards.\n\n" +
            "By using this service, you confirm that you comply with this requirement.\n\n" +
            "Do you agree?"
        )) {
            document.getElementById('cameraInput').click();
        } else {
            window.location.href = "/";
        }
    };

    document.getElementById('upload-btn').onclick = function(e) {
        e.preventDefault();
        if (confirm(
            "Important Notice:\n\n" +
            "Only non-personal data may be uploaded to this website.\n" +
            "It is strictly prohibited to upload any content that contains personal information such as names, addresses, photos, school names, or any other identifiable data.\n" +
            "Uploaded files are processed automatically by external AI services by Google, Roboflow and Hackclub and saved afterwards.\n\n" +
            "By using this service, you confirm that you comply with this requirement.\n\n" +
            "Do you agree?"
        )) {
            document.getElementById('uploadInput').click();
        } else {
            window.location.href = "/";
        }
    };

    document.getElementById('cameraInput').onchange = function(e) {
        const file = e.target.files[0];
        if (!file) return;
        processImageUpload(file, true); // true indicates camera capture
    };

    document.getElementById('uploadInput').onchange = function(e) {
        const file = e.target.files[0];
        if (!file) return;
        processImageUpload(file, false); // false indicates file upload
    };

    window.addEventListener('DOMContentLoaded', () => {
        const container = document.querySelector(".camera-area");
        const lastScan = localStorage.getItem('lastScan');

        if (lastScan) {
            container.innerHTML = `
                <div class="text-center">
                    <p class="text-small">Last Scanned Image:</p>
                    <img src="${lastScan}" alt="Last Processed Image" class="img-fluid rounded" style="max-height: 400px;">
                    <div class="mt-3 d-flex gap-2 justify-content-center flex-wrap">
                        <a href="${lastScan}" download="last_scan.png" class="btn btn-success">
                            <i class="bi bi-download"></i> Download
                        </a>
                        <a href="/" class="btn btn-primary">
                            <i class="bi bi-house-door"></i> View All Scans
                        </a>
                    </div>
                </div>
            `;
        }
    });

    // Mobile/desktop button visibility
    if (!/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
        var scanBtn = document.getElementById('scan-btn');
        if (scanBtn) {
            scanBtn.style.display = 'none';
        }
        var uploadBtn = document.getElementById('upload-btn');
        if (uploadBtn) {
            uploadBtn.style.left = '50%';
            uploadBtn.style.transform = 'translateX(-50%)';
        }
    }
</script>
</body>
</html>
