<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="manifest" href="/static/json/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" sizes="1024x1024" href="/static/images/1024.png">
</head>
<body>
    <div class="container mt-3">
        <div class="top-bar text-center">
            <h2 class="fw-bold">Home</h2>
            <div class="d-flex justify-content-center">
                <a class="btn btn-custom" id="scan-button" href="/scan">
                    <i class="bi bi-camera"></i> Scan
                </a>
                <a class="btn btn-custom" id="upload-button" href="/scan">
                    <i class="bi bi-upload"></i> Upload
                </a>
                <!-- <input type="file" id="uploadInput" accept="image/*,.pdf" style="display: none;">
                <button class="btn btn-custom" id="upload-button" onclick="document.getElementById('uploadInput').click()">
                    <i class="bi bi-upload"></i> Upload
                </button> -->
            </div>
        </div>
        {% if uploaded_image %}
            <h2>Uploaded Image:</h2>
            <img src="{{ uploaded_image }}" alt="Processed image" style="max-width: 100%;">
        {% endif %}
        {% for q in questions %}
        <div class="card-custom">
            <div>
                <span><strong>{{ q.type }}</strong></span>
                <span class="status-badge">{{ q.status }}</span>
            </div>
            <p class="mt-2 mb-1">{{ q.description }}</p>
            <a href="javascript:void(0);" class="text-success fw-semibold"
            onclick="alert('Details coming soon!');">View Details</a>
        </div>
        {% endfor %}
    </div>

    <div class="bottom-nav">
        <a href="/" class="text-decoration-none nav-icon active">
            <i class="bi bi-house-door-fill"></i>
            Home
        </a>
        <a href="/scan" class="text-decoration-none nav-icon" id="scan-bar">
            <i class="bi bi-camera-fill"></i>
            Scan
        </a>
        <a href="javascript:void(0);" class="text-decoration-none nav-icon"
        onclick="alert('Chat feature coming soon!');">
            <i class="bi bi-chat-dots-fill"></i>
            Chat
        </a>
        <a href="javascript:void(0);" class="text-decoration-none nav-icon"
        onclick="alert('Settings feature coming soon!');">
            <i class="bi bi-gear-fill"></i>
            Settings
        </a>
    </div>
<script>
//document.getElementById('uploadInput').onchange = function(e) {
//    const file = e.target.files[0];
//    if (file) {
//        const formData = new FormData();
//        formData.append('image', file);
//        fetch('/upload', { method: 'POST', body: formData });
//    }
//};
if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
    const button = document.getElementById('scan-button');
    button.style.display = 'block'; // Corrected from "element"
    
    const bar = document.getElementById('scan-bar');
    bar.style.display = 'block'; // Corrected from "element"
} else {
    const button = document.getElementById('scan-button');
    button.style.display = 'none'; // Corrected from "element"
    
    const bar = document.getElementById('scan-bar');
    bar.style.display = 'block'; // Corrected from "element"
}
</script>
</body>
</html>
