<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
    <div class="container mt-3">
        <div class="top-bar text-center">
            <h2 class="fw-bold">Home</h2>
            <div class="d-flex justify-content-center">
                <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;">
                <button class="btn btn-custom" onclick="document.getElementById('cameraInput').click()">
                    <i class="bi bi-camera"></i> Scan
                </button>
                <button class="btn btn-custom"><i class="bi bi-upload"></i> Upload</button>
            </div>
        </div>

        {% for q in questions %}
        <div class="card-custom">
            <div>
                <span><strong>{{ q.type }}</strong></span>
                <span class="status-badge">{{ q.status }}</span>
            </div>
            <p class="mt-2 mb-1">{{ q.description }}</p>
            <a href="#" class="text-success fw-semibold">View Details</a>
        </div>
        {% endfor %}
    </div>

    <div class="bottom-nav">
        <a href="/" class="text-decoration-none nav-icon active">
            <i class="bi bi-house-door-fill"></i>
            Home
        </a>
        <a href="/scan" class="text-decoration-none nav-icon">
            <i class="bi bi-camera-fill"></i>
            Scan
        </a>
        <a href="#" class="text-decoration-none nav-icon">
            <i class="bi bi-chat-dots-fill"></i>
            Chat
        </a>
        <a href="#" class="text-decoration-none nav-icon">
            <i class="bi bi-gear-fill"></i>
            Settings
        </a>
    </div>
<script>
document.getElementById('cameraInput').onchange = function(e) {
    const file = e.target.files[0];
    if (file) {
        const formData = new FormData();
        formData.append('image', file);
        fetch('/upload', { method: 'POST', body: formData });
    }
};
</script>
</body>
</html>
