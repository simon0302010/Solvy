<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="manifest" href="/static/json/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" sizes="1024x1024" href="/static/images/1024.png">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <script>
        // On page load, apply saved theme
        if (localStorage.getItem("darkMode") === "true") {
          document.documentElement.classList.add("dark");
        }
      </script>      
</head>
<body>
    <div class="container mt-3">
        <div class="top-bar text-center">
            <h2 class="fw-bold">Home</h2>
            <div class="d-flex justify-content-center">
                <a class="btn btn-custom" id="scan-button" href="/scan">
                    <i class="bi bi-camera"></i> Scan
                </a>
                <a class="btn btn-custom" id="upload-button" href="/scan">
                    <i class="bi bi-upload"></i> Upload
                </a>
            </div>
        </div>
        
        <!-- History Section -->
        <div class="d-flex justify-content-between align-items-center mt-4 mb-3 text-white">
            <h4 class="fw-bold mb-0">Recent Scans</h4>
            <button class="btn btn-outline-danger btn-sm" id="clear-history" onclick="clearHistory()">
                <i class="bi bi-trash"></i> Clear All
            </button>
        </div>
        
        <div id="history-container" class="text-white">
            <!-- History items will be loaded here by JavaScript -->
            <div class="text-center text py-4" id="no-history">
                <i class="bi bi-clock-history fs-1"></i>
                <p class="mt-2">No scans yet. Use the scan button to get started!</p>
            </div>
        </div>
        
        {% if uploaded_image %}
            <h2>Uploaded Image:</h2>
            <img src="{{ uploaded_image }}" alt="Processed image" style="max-width: 100%;">
        {% endif %}
    </div>

    <div class="bottom-nav">
        <a href="/" class="text-decoration-none nav-icon active">
            <i class="bi bi-house-door-fill"></i>
            Home
        </a>
        <a href="/scan" class="text-decoration-none nav-icon" id="scan-bar">
            <i id="scan-icon" class="bi bi-camera-fill"></i>
            <span id="scan-label">Scan</span>
        </a>
        <a href="/chat" class="text-decoration-none nav-icon">
            <i class="bi bi-chat-dots-fill"></i>
            Chat
        </a>
        <a href="/settings" class="text-decoration-none nav-icon nav-active">
            <i class="bi bi-gear-fill"></i>
            Settings
        </a>
    </div>

<script>
window.addEventListener('DOMContentLoaded', function () {
    loadHistory();

    // Swap Scan icon & label for Upload if on desktop
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    if (!isMobile) {
        const scanBar = document.getElementById('scan-bar');
        const scanIcon = document.getElementById('scan-icon');
        const scanLabel = document.getElementById('scan-label');

        if (scanIcon) scanIcon.className = 'bi bi-upload';
        if (scanLabel) scanLabel.textContent = 'Upload';
    }

    // Cleanup localStorage for new scans
    const newScan = localStorage.getItem('newScanData');
    if (newScan) {
        try {
            JSON.parse(newScan);
            localStorage.removeItem('newScanData');
        } catch (e) {
            console.error('Error processing new scan data:', e);
        }
    }
});
    // Load saved settings
    window.addEventListener("DOMContentLoaded", () => {
      if (localStorage.getItem("darkMode") === "true") {
        document.body.classList.add("dark-mode");
        document.getElementById("darkModeToggle").checked = true;
      }

      const fontSize = localStorage.getItem("fontSize") || "medium";
      document.getElementById("fontSizeSelect").value = fontSize;
      document.body.style.fontSize = fontSizeMap[fontSize];

      document.getElementById("languageSelect").value = localStorage.getItem("language") || "en";
      document.getElementById("regionInput").value = localStorage.getItem("region") || ""
    });
// History management functions
function loadHistory() {
    const history = JSON.parse(localStorage.getItem('scanHistory') || '[]');
    const container = document.getElementById('history-container');
    const noHistory = document.getElementById('no-history');
    
    if (history.length === 0) {
        noHistory.style.display = 'block';
        return;
    }
    
    noHistory.style.display = 'none';
    
    // Sort by timestamp (newest first)
    history.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
    
    container.innerHTML = history.map((item, index) => `
        <div class="card-custom">
            <div class="d-flex justify-content-between align-items-center">
    <span><strong>Scan #${history.length - index}</strong></span>
    <div class="d-flex align-items-center gap-2">
        <span class="badge bg-success">Processed</span>
        <button class="btn btn-outline-danger btn-sm" onclick="deleteHistoryItem('${item.id}')">
            <i class="bi bi-trash"></i>
        </button>
    </div>
</div>

            <p class="mt-2 mb-2 text small">
                <i class="bi bi-clock"></i> ${formatDate(item.timestamp)}
                ${item.filename ? `<br><i class="bi bi-file-image"></i> ${item.filename}` : ''}
            </p>
            <div class="mb-2">
                <img src="${item.image_data}" alt="Processed scan" 
                     class="img-fluid rounded" style="max-height: 150px; cursor: pointer;"
                     onclick="viewFullImage('${item.image_data}', '${item.filename || 'scan'}')">
            </div>
            <div class="d-flex gap-2">
                <a href="${item.image_data}" download="${item.filename || 'scan_' + item.id}.png" 
                   class="btn btn-success btn-sm">
                    <i class="bi bi-download"></i> Download
                </a>
                <button class="btn btn-primary btn-sm" onclick="viewFullImage('${item.image_data}', '${item.filename || 'scan'}')">
                    <i class="bi bi-eye"></i> View
                </button>
            </div>
        </div>
    `).join('');
}

function deleteHistoryItem(id) {
    if (confirm('Are you sure you want to delete this scan?')) {
        const history = JSON.parse(localStorage.getItem('scanHistory') || '[]');
        const filteredHistory = history.filter(item => item.id !== id);
        localStorage.setItem('scanHistory', JSON.stringify(filteredHistory));
        loadHistory();
    }
}

function clearHistory() {
    if (confirm('Are you sure you want to clear all scan history? This cannot be undone.')) {
        localStorage.removeItem('scanHistory');
        localStorage.removeItem('lastScan'); // Also clear the last scan from scan page
        loadHistory();
    }
}
function loadScanHistory() {
    const history = JSON.parse(localStorage.getItem('scanHistory') || '[]');
    const container = document.getElementById('scan-history'); // Make sure this exists in your home.html
    
    if (history.length === 0) {
        container.innerHTML = '<p class="text-muted text-center">No scans yet. <a href="/scan">Scan your first image!</a></p>';
        return;
    }
    
    container.innerHTML = history.map(item => `
        <div class="card mb-3">
            <div class="row g-0">
                <div class="col-md-4">
                    <img src="${item.image_data}" class="img-fluid rounded-start" alt="Scanned image" style="height: 150px; object-fit: cover;">
                </div>
                <div class="col-md-8">
                    <div class="card-body">
                        <h5 class="card-title">${item.filename}</h5>
                        <p class="card-text">
                            <small class="text-muted">
                                ${new Date(item.timestamp).toLocaleString()} 
                                • ${item.source === 'camera' ? 'Camera' : 'Upload'}
                                ${item.status !== 'success' ? ` • ${item.status}` : ''}
                            </small>
                        </p>
                        <div class="btn-group" role="group">
                            <a href="/chat/${item.chat_id || item.id}" class="btn btn-primary btn-sm" onclick="setImageForChat('${item.id}', '${item.image_data}')">
                                <i class="bi bi-chat-dots"></i> Chat
                            </a>
                            <a href="${item.image_data}" download="${item.filename}" class="btn btn-success btn-sm">
                                <i class="bi bi-download"></i> Download
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    `).join('');
}

function setImageForChat(itemId, imageData) {
    // Set the image for the specific chat session
    localStorage.setItem(`imageBase64_${itemId}`, imageData);
    localStorage.setItem('imageBase64', imageData); // Also set globally as fallback
}

// Load history when page loads
window.addEventListener('DOMContentLoaded', loadScanHistory);
function formatDate(timestamp) {
    const date = new Date(timestamp);
    const now = new Date();
    const diffMs = now - date;
    const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
    const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
    
    if (diffHours < 1) {
        const diffMins = Math.floor(diffMs / (1000 * 60));
        return diffMins < 1 ? 'Just now' : `${diffMins} min${diffMins > 1 ? 's' : ''} ago`;
    } else if (diffDays < 1) {
        return `${diffHours} hour${diffHours > 1 ? 's' : ''} ago`;
    } else if (diffDays < 7) {
        return `${diffDays} day${diffDays > 1 ? 's' : ''} ago`;
    } else {
        return date.toLocaleDateString();
    }
}

function viewFullImage(imageData, filename) {
    // Create a modal to view the full image
    const modal = document.createElement('div');
    modal.style.cssText = `
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
        background: rgba(0,0,0,0.8); z-index: 9999; display: flex; 
        align-items: center; justify-content: center; padding: 20px;
    `;
    
    modal.innerHTML = `
        <div style="position: relative; max-width: 90%; max-height: 90%;">
            <button onclick="this.parentElement.parentElement.remove()" 
                    style="position: absolute; top: -10px; right: -10px; 
                           background: white; border: none; border-radius: 50%; 
                           width: 30px; height: 30px; cursor: pointer; z-index: 10000;">
                ×
            </button>
            <img src="${imageData}" alt="${filename}" 
                 style="max-width: 100%; max-height: 100%; border-radius: 8px;">
        </div>
    `;
    
    document.body.appendChild(modal);
    
    // Close on click outside
    modal.addEventListener('click', function(e) {
        if (e.target === modal) {
            modal.remove();
        }
    });
}

// Check if user came from scan page with new scan
window.addEventListener('DOMContentLoaded', function() {
    loadHistory();
    
    // Check if there's a new scan from the scan page
    const newScan = localStorage.getItem('newScanData');
    if (newScan) {
        try {
            const scanData = JSON.parse(newScan);
            localStorage.removeItem('newScanData'); // Clean up
        } catch (e) {
            console.error('Error processing new scan data:', e);
        }
    }
});
</script>
</body>
</html>
