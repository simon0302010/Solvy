<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="manifest" href="/static/json/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" sizes="1024x1024" href="/static/images/1024.png">
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
</head>
<body>
  <div class="container mt-3">
    <div class="top-bar text-center">
      <h2 class="fw-bold">Chat</h2>
    </div>

    <main id="chat-history" class="mt-4"></main>
  </div>

  <div class="bottom-nav">
    <a href="/" class="text-decoration-none nav-icon">
        <i class="bi bi-house-door-fill"></i>
        Home
    </a>
    <a href="/scan" class="text-decoration-none nav-icon active" id="scan-bar">
        <i id="scan-icon" class="bi bi-camera-fill"></i>
        <span id="scan-label">Scan</span>
    </a>        
    <a href="/chat" class="text-decoration-none nav-icon">
        <i class="bi bi-chat-dots-fill"></i>
        Chat
    </a>
    <a href="javascript:void(0);" class="text-decoration-none nav-icon"
    onclick="alert('Settings feature coming soon!');">
        <i class="bi bi-gear-fill"></i>
        Settings
    </a>
</div>
  </div>

  <script>
        // Desktop override for Scan button in bottom nav
const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
if (!isMobile) {
    const scanIcon = document.getElementById('scan-icon');
    const scanLabel = document.getElementById('scan-label');
    const scanDir = document.getElementById('scan-dir');
    if (scanIcon) scanIcon.className = 'bi bi-upload';
    if (scanLabel) scanLabel.textContent = 'Upload';
    if (scanDir) scanDir.textContent = 'Tap the upload button to capture a question.';
}
    document.addEventListener("DOMContentLoaded", () => {
      const container = document.getElementById("chat-history");
      const history = JSON.parse(localStorage.getItem("scanHistory") || "[]");

      if (history.length === 0) {
        container.innerHTML = "<p class='text-muted text-center'>No chats found.</p>";
        return;
      }

      container.innerHTML = history.map((item, index) => `
        <a href="/chat/${item.id}" class="text-decoration-none text-white">
          <div class="card-custom mb-3 p-3 d-flex justify-content-between align-items-center">
            <div>
              <strong>Scan #${history.length - index}</strong><br>
              <small class="text-muted">${item.filename || "Uploaded Image"}</small>
            </div>
            <div class="d-flex align-items-center gap-2">
              <span class="badge bg-success">Processed</span>
              <i class="bi bi-chevron-right text-white"></i>
            </div>
          </div>
        </a>
      `).join("");
    });
    const chatId = "{{ chat_id }}";
    console.log("Chat ID:", chatId);
    // TODO: Use chatId to load messages from localStorage or backend

  </script>
</body>
</html>
