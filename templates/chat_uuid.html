<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Chat Session</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div class="container mt-3">
    <div class="top-bar text-center">
      <h2 class="fw-bold">Chatbot</h2>
    </div>

    <!-- Image preview -->
    <div class="text-center mb-3">
      <img id="image-preview" src="" style="max-height: 200px; display: none;" />
    </div>

    <div id="chat-window" class="border rounded p-3 mb-3" style="height: 60vh; overflow-y: auto; background: #f9f9f9;">
      <!-- Messages will be appended here -->
    </div>

    <form id="chat-form" class="d-flex gap-2">
      <input type="text" id="user-input" class="form-control" placeholder="Type a message..." required />
      <button class="btn btn-primary" type="submit">
        <i class="bi bi-send-fill"></i>
      </button>
    </form>
  </div>

  <script>
    const chatId = "{{ chat_id }}";
    const chatWindow = document.getElementById("chat-window");
    const input = document.getElementById("user-input");
    const form = document.getElementById("chat-form");
    const preview = document.getElementById("image-preview");

    // Copy uploaded image from sessionStorage (if available)
    const uploadedImage = sessionStorage.getItem("uploadedImage");
    if (uploadedImage) {
      localStorage.setItem("imageBase64", uploadedImage);
      sessionStorage.removeItem("uploadedImage");
    }

    // Set preview if image exists
    const imageBase64 = localStorage.getItem("imageBase64");
    if (imageBase64) {
      preview.src = imageBase64;
      preview.style.display = "block";
    }

    function appendMessage(role, text) {
      const wrapper = document.createElement("div");
      wrapper.className = "mb-2";

      const bubble = document.createElement("div");
      bubble.className = role === "user" ? "text-end" : "text-start";
      bubble.innerHTML = `
        <span class="badge ${role === "user" ? "bg-primary" : "bg-success"}">
          ${text}
        </span>
      `;

      wrapper.appendChild(bubble);
      chatWindow.appendChild(wrapper);
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    async function loadHistory() {
      try {
        const res = await fetch(`/api/chat/${chatId}`);
        const data = await res.json();
        data.history.forEach((m) => appendMessage(m.role, m.text));
      } catch (err) {
        appendMessage("model", "Failed to load chat history.");
      }
    }

    async function sendMessage(text) {
      appendMessage("user", text);
      input.value = "";

      const imageBase64 = localStorage.getItem("imageBase64") || null;
      if (!imageBase64) {
        appendMessage("model", "⚠️ No image found. Please scan or upload first.");
        return;
      }

      try {
        const res = await fetch(`/api/chat/${chatId}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, image_base64: imageBase64 }),
        });
        const data = await res.json();
        if (data.reply) {
          appendMessage("model", data.reply);
        } else {
          appendMessage("model", "❌ Gemini failed to reply.");
        }
      } catch (err) {
        appendMessage("model", "Something went wrong. Try again.");
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (text) sendMessage(text);
    });

    loadHistory();
  </script>
</body>
</html>
